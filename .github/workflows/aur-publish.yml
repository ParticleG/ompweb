name: Update and publish AUR package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aur-publish.yml
      - .gitignore
      - .SRCINFO
      - PKGBUILD
      - README.md
  schedule:
    - cron: '41 */6 * * *'
  repository_dispatch:
    types:
      - upstream-release
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish the current recipe even when the upstream version is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aur-publish-ompweb
  cancel-in-progress: false

env:
  PACKAGE_NAME: ompweb
  NPM_PACKAGE: '@kahme247/ompweb'
  UPSTREAM_REPOSITORY: kahme247/ompweb

jobs:
  update-and-publish:
    name: Update, verify, and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download locked upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest")"
          tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
          version="${tag#v}"
          source_date_epoch="$(jq -r '.published_at | fromdateiso8601' <<<"$release_json")"

          if [[ -z "$tag" || "$version" == *-* || ! "$version" =~ ^[0-9][0-9A-Za-z._+]*$ || ( "$tag" != "$version" && "$tag" != "v$version" ) ]]; then
            printf 'Unsupported upstream release tag: %s\n' "$tag" >&2
            exit 1
          fi

          published_version="$(npm view "${NPM_PACKAGE}@${version}" version)"
          tarball_url="$(npm view "${NPM_PACKAGE}@${version}" dist.tarball)"
          npm_integrity="$(npm view "${NPM_PACKAGE}@${version}" dist.integrity)"
          if [[ "$published_version" != "$version" || -z "$tarball_url" || "$npm_integrity" != sha512-* ]]; then
            printf 'npm package %s@%s is not available or lacks SHA-512 integrity\n' \
              "$NPM_PACKAGE" "$version" >&2
            exit 1
          fi

          download_dir="$RUNNER_TEMP/ompweb-upstream"
          rm -rf "$download_dir"
          mkdir -p "$download_dir"
          npm_archive="$download_dir/$PACKAGE_NAME-$version.tgz"
          lockfile="$download_dir/package-lock.json"

          curl --fail --location --retry 3 --output "$npm_archive" "$tarball_url"
          expected_integrity="${npm_integrity#sha512-}"
          actual_integrity="$(openssl dgst -sha512 -binary "$npm_archive" | base64 -w 0)"
          if [[ "$actual_integrity" != "$expected_integrity" ]]; then
            printf 'npm archive integrity mismatch for %s@%s\n' \
              "$NPM_PACKAGE" "$version" >&2
            exit 1
          fi

          gh api \
            --method GET \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/${UPSTREAM_REPOSITORY}/contents/package-lock.json" \
            -f "ref=$tag" \
            >"$lockfile"

          npm_sha256="$(sha256sum "$npm_archive" | cut -d ' ' -f 1)"
          lockfile_sha256="$(sha256sum "$lockfile" | cut -d ' ' -f 1)"
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
            printf 'npm_archive=%s\n' "$npm_archive"
            printf 'npm_sha256=%s\n' "$npm_sha256"
            printf 'lockfile=%s\n' "$lockfile"
            printf 'lockfile_sha256=%s\n' "$lockfile_sha256"
          } >>"$GITHUB_OUTPUT"

      - name: Build locked runtime bundle
        id: bundle
        env:
          LOCKFILE: ${{ steps.upstream.outputs.lockfile }}
          NPM_ARCHIVE: ${{ steps.upstream.outputs.npm_archive }}
          SOURCE_DATE_EPOCH: ${{ steps.upstream.outputs.source_date_epoch }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          bundle_root="$RUNNER_TEMP/ompweb-bundle"
          npm_cache="$RUNNER_TEMP/ompweb-npm-cache"
          rm -rf "$bundle_root" "$npm_cache"
          mkdir -p "$bundle_root/ompweb" "$npm_cache"

          tar --extract \
            --gzip \
            --file "$NPM_ARCHIVE" \
            --strip-components 1 \
            --directory "$bundle_root/ompweb"
          cp "$LOCKFILE" "$bundle_root/ompweb/package-lock.json"

          test "$(uname -m)" = x86_64
          [[ "$(getconf GNU_LIBC_VERSION)" == glibc* ]]
          npm ci \
            --prefix "$bundle_root/ompweb" \
            --cache "$npm_cache" \
            --omit=dev \
            --ignore-scripts

          node -e '
            const manifest = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (manifest.version !== process.argv[2]) process.exit(1);
          ' "$bundle_root/ompweb/package.json" "$VERSION"

          bundle_name="$PACKAGE_NAME-$VERSION-x86_64.tar.gz"
          bundle_path="$GITHUB_WORKSPACE/$bundle_name"
          verification_path="$RUNNER_TEMP/$bundle_name"

          create_bundle() {
            local output=$1
            tar \
              --sort=name \
              --mtime="@$SOURCE_DATE_EPOCH" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --format=gnu \
              --directory "$bundle_root" \
              --create \
              --file - \
              ompweb \
              | gzip -n -9 >"$output"
          }

          create_bundle "$bundle_path"
          create_bundle "$verification_path"
          cmp --silent "$bundle_path" "$verification_path"

          bundle_sha256="$(sha256sum "$bundle_path" | cut -d ' ' -f 1)"
          {
            printf 'name=%s\n' "$bundle_name"
            printf 'path=%s\n' "$bundle_path"
            printf 'sha256=%s\n' "$bundle_sha256"
            printf 'tag=bundle-v%s-%s\n' "$VERSION" "$bundle_sha256"
          } >>"$GITHUB_OUTPUT"

      - name: Update package recipe
        env:
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("PKGBUILD")
          text = path.read_text()
          version = os.environ["VERSION"]
          new_checksum = os.environ["BUNDLE_SHA256"]

          def require_match(pattern):
              match = re.search(pattern, text, flags=re.MULTILINE)
              if match is None:
                  raise SystemExit(f"Missing required PKGBUILD field: {pattern!r}")
              return match

          current_version = require_match(r"^pkgver=(.+)$").group(1)
          current_pkgrel = int(require_match(r"^pkgrel=([0-9]+)$").group(1))
          current_checksum = require_match(
              r"^_bundle_sha256='([0-9a-f]{64})'$"
          ).group(1)

          if current_version != version:
              pkgrel = 1
          elif current_checksum != new_checksum:
              pkgrel = current_pkgrel + 1
          else:
              pkgrel = current_pkgrel

          replacements = (
              (r"^pkgver=.*$", f"pkgver={version}"),
              (r"^pkgrel=.*$", f"pkgrel={pkgrel}"),
              (
                  r"^_bundle_sha256='[0-9a-f]{64}'$",
                  f"_bundle_sha256='{new_checksum}'",
              ),
          )
          for pattern, replacement in replacements:
              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(
                      f"Expected one match for {pattern!r}, found {count}"
                  )

          path.write_text(text)
          PY

      - name: Generate SRCINFO
        run: |
          set -euo pipefail

          srcinfo_dir="$RUNNER_TEMP/package-srcinfo"
          rm -rf "$srcinfo_dir"
          mkdir -p "$srcinfo_dir"
          cp PKGBUILD "$srcinfo_dir/"

          docker run --rm \
            --env BUILD_UID="$(id -u)" \
            --volume "$srcinfo_dir:/pkg" \
            --workdir /pkg \
            archlinux:base-devel \
            bash -euc '
              useradd --uid "$BUILD_UID" --create-home builder
              runuser -u builder -- makepkg --printsrcinfo
            ' >.SRCINFO

      - name: Build and validate package
        env:
          BUNDLE_PATH: ${{ steps.bundle.outputs.path }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          build_dir="$RUNNER_TEMP/package-build"
          rm -rf "$build_dir"
          mkdir -p "$build_dir"
          cp PKGBUILD "$BUNDLE_PATH" "$build_dir/"

          docker run --rm \
            --network none \
            --env BUILD_UID="$(id -u)" \
            --volume "$build_dir:/pkg" \
            --workdir /pkg \
            archlinux:base-devel \
            bash -euc '
              useradd --uid "$BUILD_UID" --create-home builder
              chown -R builder:builder /pkg
              runuser -u builder -- makepkg --verifysource --force --noconfirm
              runuser -u builder -- makepkg --force --nodeps --noconfirm

              package_root="pkg/ompweb"
              test -L "$package_root/usr/bin/ompweb"
              test "$(readlink "$package_root/usr/bin/ompweb")" = \
                "../lib/node_modules/@kahme247/ompweb/bin/omp-web.js"
              test -f "$package_root/usr/share/licenses/ompweb/LICENSE"
              test -f \
                "$package_root/usr/lib/node_modules/@kahme247/ompweb/package-lock.json"
              test -d \
                "$package_root/usr/lib/node_modules/@kahme247/ompweb/.next"
            '

          docker run --rm \
            --env BUILD_UID="$(id -u)" \
            --env VERSION \
            --volume "$build_dir:/pkg" \
            --workdir /pkg \
            archlinux:base-devel \
            bash -euc '
              useradd --uid "$BUILD_UID" --create-home builder
              chown -R builder:builder /pkg
              pacman -Syu --needed --noconfirm nodejs

              package_root="pkg/ompweb"
              node -e "
                const manifest = JSON.parse(require(\"fs\").readFileSync(process.argv[1], \"utf8\"));
                if (manifest.version !== process.argv[2]) process.exit(1);
              " \
                "$package_root/usr/lib/node_modules/@kahme247/ompweb/package.json" \
                "$VERSION"

              port=30177
              log_file="$(mktemp)"
              runuser -u builder -- \
                "$package_root/usr/bin/ompweb" \
                --no-open \
                --port "$port" \
                >"$log_file" 2>&1 &
              server_pid=$!
              trap "kill \"$server_pid\" 2>/dev/null || true" EXIT

              ready=false
              for _ in $(seq 1 60); do
                if curl --fail --silent "http://127.0.0.1:$port/" \
                  | grep --fixed-strings --quiet "<title>omp web</title>"; then
                  ready=true
                  break
                fi
                sleep 0.5
              done
              if [[ "$ready" != true ]]; then
                cat "$log_file" >&2
                exit 1
              fi
            '

      - name: Publish locked runtime bundle
        env:
          ASSET_NAME: ${{ steps.bundle.outputs.name }}
          ASSET_PATH: ${{ steps.bundle.outputs.path }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          BUNDLE_TAG: ${{ steps.bundle.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          LOCKFILE_SHA256: ${{ steps.upstream.outputs.lockfile_sha256 }}
          NPM_SHA256: ${{ steps.upstream.outputs.npm_sha256 }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          printf -v notes \
            'Locked Linux x86_64 runtime bundle for %s at %s.\n\nnpm archive SHA-256: %s\npackage-lock.json SHA-256: %s\nbundle SHA-256: %s\n' \
            "$UPSTREAM_REPOSITORY" \
            "$UPSTREAM_TAG" \
            "$NPM_SHA256" \
            "$LOCKFILE_SHA256" \
            "$BUNDLE_SHA256"

          if gh release view "$BUNDLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$BUNDLE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ompweb $VERSION locked runtime bundle" \
              --notes "$notes"

            existing_dir="$RUNNER_TEMP/existing-bundle"
            rm -rf "$existing_dir"
            mkdir -p "$existing_dir"
            if gh release download "$BUNDLE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME" \
              --dir "$existing_dir"; then
              if ! cmp --silent "$ASSET_PATH" "$existing_dir/$ASSET_NAME"; then
                echo 'Immutable release bundle does not match its checksum tag.' >&2
                exit 1
              fi
              echo 'Existing release bundle is unchanged.'
              exit 0
            fi

            gh release upload "$BUNDLE_TAG" "$ASSET_PATH" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$BUNDLE_TAG" "$ASSET_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ompweb $VERSION locked runtime bundle" \
              --notes "$notes"
          fi

      - name: Detect recipe changes
        id: changes
        run: |
          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          else
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          fi

      - name: Commit updated recipe
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          git config user.name 'ParticleG'
          git config user.email 'particle_g@outlook.com'
          git add PKGBUILD .SRCINFO
          git commit -m "Update ompweb to ${VERSION}"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish to AUR
        if: >-
          steps.changes.outputs.changed == 'true' ||
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'repository_dispatch' ||
          github.event.inputs.force_publish == 'true'
        env:
          AUR_REPOSITORY_URL: ssh://aur@aur.archlinux.org/ompweb.git
          AUR_SSH_ED25519_FINGERPRINT: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          AUR_SSH_ED25519_KEY: AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          AUR_SSH_HOST: aur.archlinux.org
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$AUR_REPOSITORY_URL" == ssh://aur@aur.archlinux.org/* ]]; then
            if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
              echo 'AUR_SSH_PRIVATE_KEY is required.' >&2
              exit 1
            fi

            ssh_dir="$RUNNER_TEMP/aur-ssh"
            key_file="$ssh_dir/id_ed25519"
            known_hosts="$ssh_dir/known_hosts"
            install -d -m 700 "$ssh_dir"
            printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >"$key_file"
            chmod 600 "$key_file"
            trap 'rm -f "$key_file"' EXIT

            printf '%s ssh-ed25519 %s\n' \
              "$AUR_SSH_HOST" "$AUR_SSH_ED25519_KEY" >"$known_hosts"
            actual_fingerprint="$(
              ssh-keygen -E sha256 -lf "$known_hosts" \
                | cut -d ' ' -f 2 \
                | sort -u
            )"
            if [[ "$actual_fingerprint" != "$AUR_SSH_ED25519_FINGERPRINT" ]]; then
              printf 'Unexpected AUR SSH fingerprint: %s\n' \
                "$actual_fingerprint" >&2
              exit 1
            fi

            export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          fi

          aur_dir="$RUNNER_TEMP/aur-repository"
          rm -rf "$aur_dir"
          if ! git clone "$AUR_REPOSITORY_URL" "$aur_dir"; then
            echo 'AUR clone failed; bootstrapping an empty local repository.'
            rm -rf "$aur_dir"
            git init --initial-branch=master "$aur_dir"
            git -C "$aur_dir" remote add origin "$AUR_REPOSITORY_URL"
          fi

          if git -C "$aur_dir" rev-parse --verify HEAD >/dev/null 2>&1; then
            git -C "$aur_dir" checkout -B master
          else
            git -C "$aur_dir" symbolic-ref HEAD refs/heads/master
          fi

          git -C "$aur_dir" rm -r --ignore-unmatch -- .
          cp PKGBUILD .SRCINFO .gitignore README.md "$aur_dir/"
          git -C "$aur_dir" add PKGBUILD .SRCINFO .gitignore README.md

          if git -C "$aur_dir" diff --cached --quiet; then
            echo 'AUR package repository is already up to date.'
            exit 0
          fi

          git -C "$aur_dir" config user.name 'ParticleG'
          git -C "$aur_dir" config user.email 'particle_g@outlook.com'
          git -C "$aur_dir" commit -m "Update to $VERSION"
          git -C "$aur_dir" push origin HEAD:master
