name: Update and publish AUR package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aur-publish.yml
      - .gitignore
      - .SRCINFO
      - PKGBUILD
  schedule:
    - cron: '41 */6 * * *'
  repository_dispatch:
    types:
      - upstream-release
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish the current recipe even when the upstream version is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aur-publish-ompweb
  cancel-in-progress: false

env:
  PACKAGE_NAME: ompweb
  NPM_PACKAGE: '@kahme247/ompweb'
  UPSTREAM_REPOSITORY: kahme247/ompweb

jobs:
  update-and-publish:
    name: Update, verify, and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest")"
          tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
          version="${tag#v}"

          if [[ -z "$tag" || "$version" == *-* || ! "$version" =~ ^[0-9][0-9A-Za-z._+]*$ || ( "$tag" != "$version" && "$tag" != "v$version" ) ]]; then
            printf 'Unsupported upstream release tag: %s\n' "$tag" >&2
            exit 1
          fi

          published_version="$(npm view "${NPM_PACKAGE}@${version}" version)"
          tarball_url="$(npm view "${NPM_PACKAGE}@${version}" dist.tarball)"
          if [[ "$published_version" != "$version" || -z "$tarball_url" ]]; then
            printf 'npm package %s@%s is not available\n' "$NPM_PACKAGE" "$version" >&2
            exit 1
          fi

          archive="$PACKAGE_NAME-$version.tgz"
          curl --fail --location --retry 3 --output "$archive" "$tarball_url"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"

          {
            printf 'version=%s\n' "$version"
            printf 'archive_sha256=%s\n' "$archive_sha256"
          } >>"$GITHUB_OUTPUT"

      - name: Update package recipe
        env:
          ARCHIVE_SHA256: ${{ steps.upstream.outputs.archive_sha256 }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("PKGBUILD")
          text = path.read_text()
          version = os.environ["VERSION"]
          new_checksum = os.environ["ARCHIVE_SHA256"]

          def require_match(pattern):
              match = re.search(pattern, text, flags=re.MULTILINE)
              if match is None:
                  raise SystemExit(f"Missing required PKGBUILD field: {pattern!r}")
              return match

          current_version = require_match(r"^pkgver=(.+)$").group(1)
          current_pkgrel = int(require_match(r"^pkgrel=([0-9]+)$").group(1))
          current_checksums = re.findall(
              r"^sha256sums=\('([0-9a-f]{64})'\)$",
              text,
              flags=re.MULTILINE,
          )
          if len(current_checksums) != 1:
              raise SystemExit(
                  f"Expected one SHA-256 entry, found {len(current_checksums)}"
              )

          if current_version != version:
              pkgrel = 1
          elif current_checksums[0] != new_checksum:
              pkgrel = current_pkgrel + 1
          else:
              pkgrel = current_pkgrel

          replacements = (
              (r"^pkgver=.*$", f"pkgver={version}"),
              (r"^pkgrel=.*$", f"pkgrel={pkgrel}"),
              (
                  r"^sha256sums=\('[0-9a-f]{64}'\)$",
                  f"sha256sums=('{new_checksum}')",
              ),
          )
          for pattern, replacement in replacements:
              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(
                      f"Expected one match for {pattern!r}, found {count}"
                  )

          path.write_text(text)
          PY

      - name: Generate SRCINFO
        run: |
          set -euo pipefail

          srcinfo_dir="$RUNNER_TEMP/package-srcinfo"
          rm -rf "$srcinfo_dir"
          mkdir -p "$srcinfo_dir"
          cp PKGBUILD "$srcinfo_dir/"

          docker run --rm \
            --env BUILD_UID="$(id -u)" \
            --volume "$srcinfo_dir:/pkg" \
            --workdir /pkg \
            archlinux:base-devel \
            bash -euc '
              useradd --uid "$BUILD_UID" --create-home builder
              runuser -u builder -- makepkg --printsrcinfo
            ' >.SRCINFO

      - name: Build and validate package
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          build_dir="$RUNNER_TEMP/package-build"
          rm -rf "$build_dir"
          mkdir -p "$build_dir"
          cp PKGBUILD "$PACKAGE_NAME-$VERSION.tgz" "$build_dir/"

          docker run --rm \
            --env BUILD_UID="$(id -u)" \
            --env VERSION \
            --volume "$build_dir:/pkg" \
            --workdir /pkg \
            archlinux:base-devel \
            bash -euc '
              useradd --uid "$BUILD_UID" --create-home builder
              chown -R builder:builder /pkg
              pacman -Syu --needed --noconfirm nodejs npm
              runuser -u builder -- makepkg --verifysource --force --noconfirm
              runuser -u builder -- makepkg --force --nodeps --noconfirm

              package_root="pkg/ompweb"
              test -L "$package_root/usr/bin/ompweb"
              test "$(readlink "$package_root/usr/bin/ompweb")" = \
                "../lib/node_modules/@kahme247/ompweb/bin/omp-web.js"
              test -f "$package_root/usr/share/licenses/ompweb/LICENSE"
              test -d \
                "$package_root/usr/lib/node_modules/@kahme247/ompweb/.next"
              node -e "
                const manifest = require(process.argv[1]);
                if (manifest.version !== process.argv[2]) process.exit(1);
              " \
                "$package_root/usr/lib/node_modules/@kahme247/ompweb/package.json" \
                "$VERSION"

              port=30177
              log_file="$(mktemp)"
              runuser -u builder -- \
                "$package_root/usr/bin/ompweb" \
                --no-open \
                --port "$port" \
                >"$log_file" 2>&1 &
              server_pid=$!
              trap "kill \"$server_pid\" 2>/dev/null || true" EXIT

              ready=false
              for _ in $(seq 1 60); do
                if curl --fail --silent "http://127.0.0.1:$port/" \
                  | grep --fixed-strings --quiet "<title>omp web</title>"; then
                  ready=true
                  break
                fi
                sleep 0.5
              done
              if [[ "$ready" != true ]]; then
                cat "$log_file" >&2
                exit 1
              fi
            '

      - name: Detect recipe changes
        id: changes
        run: |
          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          else
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          fi

      - name: Commit updated recipe
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          git config user.name 'ParticleG'
          git config user.email 'particle_g@outlook.com'
          git add PKGBUILD .SRCINFO
          git commit -m "Update ompweb to ${VERSION}"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish to AUR
        if: >-
          steps.changes.outputs.changed == 'true' ||
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'repository_dispatch' ||
          github.event.inputs.force_publish == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: ompweb
          pkgbuild: ./PKGBUILD
          assets: |
            .gitignore
          commit_username: ParticleG
          commit_email: particle_g@outlook.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.upstream.outputs.version }}"
